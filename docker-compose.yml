services:

  backend:
    image: python:3.12-slim

    working_dir: /app

    env_file:
      - .env

    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
      - ./data:/app/data

    ports:
      - "8000:8000"

    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn backend.app.main:app
             --host 0.0.0.0
             --port 8000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""
        ]

      interval: 10s
      timeout: 10s
      start_period: 300s
      retries: 30


  frontend:
    image: python:3.12-slim

    working_dir: /app

    env_file:
      - .env

    environment:
      STREAMLIT_BACKEND_URL: http://backend:8000

    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip

    ports:
      - "8501:8501"

    depends_on:
      backend:
        condition: service_healthy

    command: >
      sh -c "pip install -r requirements.txt &&
             streamlit run frontend/app.py
             --server.address=0.0.0.0
             --server.port=8501"


volumes:
  pip-cache: